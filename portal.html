<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#161A1F" id="themeColor">
  <title>Portal do Assinante</title>
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       PORTAL DO ASSINANTE — visual "visor de TV box"
       O visor mostra os dias em LED de 7 segmentos (SVG, sem fonte extra).
       ============================================================ */
    :root {
      --paper: #EDEFF2;
      --sheet: #FFFFFF;
      --ink: #16202A;
      --muted: #5B6775;
      --line: #DCE1E7;
      --well: #F4F6F8;
      --pay: #0B7A6F;
      --pay-ink: #FFFFFF;
      --pay-soft: #E3F3F1;
      --wa: #128C4A;
      --box: #161A1F;
      --box-edge: #2B323B;
      --box-ink: #C9D2DC;
      --led: #35E08A;
      --font: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "Atkinson Hyperlegible Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0F1318;
        --sheet: #171C22;
        --ink: #E8EDF2;
        --muted: #9AA6B3;
        --line: #2A323C;
        --well: #1E252D;
        --pay: #2FB3A4;
        --pay-ink: #062A26;
        --pay-soft: #143331;
        --wa: #1FA85F;
        --box: #0A0D11;
        --box-edge: #3A4553;
      }
    }
    /* cor do LED conforme a situação */
    [data-state="ok"]       { --led: #35E08A; }
    [data-state="warning"]  { --led: #FFB020; }
    [data-state="expired"]  { --led: #FF5A4E; }
    [data-state="blocked"], [data-state="inactive"] { --led: #7C8796; }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: var(--font); font-size: 1.0625rem; line-height: 1.5;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
    }
    :focus-visible { outline: 3px solid var(--pay); outline-offset: 2px; border-radius: 6px; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

    /* ---------- Topo ---------- */
    .top { padding: 22px 0 14px; }
    .brand { margin: 0; font-size: .95rem; color: var(--muted); font-weight: 700; }
    h1 { margin: 2px 0 0; font-size: 1.75rem; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }

    /* ---------- Visor (o elemento principal) ---------- */
    .box {
      position: relative; background: var(--box); color: var(--box-ink);
      border-radius: 22px; padding: 16px 18px 14px; border: 1px solid var(--box-edge);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 14px 30px -18px rgba(10,14,20,.55);
    }
    .box-status { display: flex; align-items: center; gap: 9px; font-size: .95rem; font-weight: 700; }
    .standby { width: 10px; height: 10px; border-radius: 50%; background: var(--led); box-shadow: 0 0 10px var(--led); flex: 0 0 auto; }
    [data-state="blocked"] .standby, [data-state="inactive"] .standby { box-shadow: none; }
    .digits { display: flex; align-items: flex-end; gap: 12px; margin: 14px 0 6px; min-height: 88px; }
    .seg-row { display: flex; gap: 8px; transform: skewX(-7deg); transform-origin: bottom left; }
    .seg-row svg { width: 50px; height: 88px; display: block; }
    .seg { fill: rgba(255,255,255,.055); transition: fill .12s; }
    .seg.on { fill: var(--led); }
    .seg-row.lit { filter: drop-shadow(0 0 7px var(--led)); }
    [data-state="blocked"] .seg-row.lit, [data-state="inactive"] .seg-row.lit { filter: none; }
    .digits-unit { font-size: 1.15rem; font-weight: 700; padding-bottom: 6px; color: var(--box-ink); }
    .box-caption { margin: 0; font-size: 1rem; color: var(--box-ink); }
    .box-foot {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--box-edge); font-size: .95rem;
    }
    .box-foot strong { color: #fff; }

    /* botão principal de pagamento logo abaixo do visor */
    .paynow {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
      min-height: 56px; margin-top: 12px; border-radius: 16px; border: 0;
      background: var(--pay); color: var(--pay-ink); font: inherit; font-weight: 700; font-size: 1.1rem;
      text-decoration: none; cursor: pointer;
    }
    .paynow svg { width: 22px; height: 22px; }

    /* ---------- Atalhos (como as teclas de um controle) ---------- */
    .keys { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; margin: 16px 0 6px; }
    .key {
      display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px;
      background: var(--sheet); border: 1px solid var(--line); border-radius: 14px;
      color: var(--ink); text-decoration: none; font-size: .86rem; font-weight: 700; text-align: center; line-height: 1.2;
    }
    .key svg { width: 24px; height: 24px; color: var(--pay); }
    .key:active { background: var(--well); }

    /* ---------- Seções ---------- */
    .blk { margin-top: 26px; scroll-margin-top: 14px; }
    .blk h2 { margin: 0 0 4px; font-size: 1.3rem; line-height: 1.25; }
    h3.subh { font-size: 1.05rem; margin: 18px 0 6px; }
    .blk > h3.subh:first-of-type { margin-top: 6px; }
    .hint { margin: 0 0 12px; color: var(--muted); font-size: .97rem; max-width: 46ch; }
    .group { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .notice {
      margin-top: 16px; border-radius: 14px; padding: 12px 14px; font-size: 1rem;
      background: var(--sheet); border: 1px solid var(--line); border-left: 6px solid #FFB020;
    }

    /* Linha inteira toca para copiar */
    .row { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row-copy {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left;
      background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer;
      padding: 12px 14px; min-height: 64px; -webkit-tap-highlight-color: transparent;
    }
    .row-copy:active { background: var(--well); }
    .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .row-label { font-size: .9rem; color: var(--muted); }
    .row-val { font-family: var(--mono); font-size: 1.08rem; font-weight: 600; overflow-wrap: anywhere; line-height: 1.35; }
    .row-val.plain { font-family: var(--font); font-weight: 700; }
    .row-val.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .95rem; }
    .copy-tag {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
      background: var(--pay-soft); color: var(--pay); font-size: .9rem; font-weight: 700;
    }
    .copy-tag svg { width: 16px; height: 16px; }
    .row.done .row-copy { background: var(--pay-soft); }
    .row.done .copy-tag { background: var(--pay); color: var(--pay-ink); }
    .eye {
      flex: 0 0 auto; width: 56px; background: transparent; border: 0; border-left: 1px solid var(--line);
      color: var(--muted); cursor: pointer; display: grid; place-items: center;
    }
    .eye svg { width: 22px; height: 22px; }
    .static { padding: 12px 14px; min-height: 64px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }

    /* Botões */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; margin-top: 10px;
      border: 0; border-radius: 14px; font: inherit; font-weight: 700; font-size: 1.05rem; text-decoration: none; cursor: pointer;
      background: var(--pay); color: var(--pay-ink);
    }
    .btn.wa { background: var(--wa); color: #fff; }
    .btn.alt { background: var(--sheet); color: var(--ink); border: 2px solid var(--line); }
    .btn svg { width: 22px; height: 22px; }
    .btn.retry { max-width: 280px; margin: 16px auto 0; }

    /* Pagamento: conta + passos numerados */
    .paycard { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .bill { padding: 16px 16px 14px; }
    .bill-line { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); padding: 2px 0; }
    .bill-line.off span:last-child { color: var(--pay); font-weight: 700; }
    .bill-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .bill-total span { font-weight: 700; }
    .bill-total strong { font-size: 2rem; line-height: 1.1; letter-spacing: -.01em; }
    .bill-due { margin: 6px 0 0; font-size: .95rem; color: var(--muted); }
    .bill-due.late { color: #C2410C; font-weight: 700; }
    @media (prefers-color-scheme: dark) { .bill-due.late { color: #FF8A65; } }
    .steps { list-style: none; margin: 0; padding: 4px 16px 6px; background: var(--well); border-top: 1px solid var(--line); }
    .step { position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px 0; }
    .step::before { /* linha que liga um passo ao próximo */
      content: ""; position: absolute; left: 16px; top: 48px; bottom: -14px; width: 2px; background: var(--line);
    }
    .step:last-child::before { display: none; }
    .step-n {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
      background: var(--sheet); border: 2px solid var(--pay); color: var(--pay); position: relative; z-index: 1;
    }
    .step.done .step-n { background: var(--pay); color: var(--pay-ink); }
    .step-t { font-weight: 700; padding-top: 5px; }
    .step-d { margin: 2px 0 0; color: var(--muted); font-size: .97rem; }
    .step .btn { margin-top: 10px; }
    .step .group { margin-top: 10px; }
    .payfoot { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
    .linkbtn { background: none; border: 0; color: var(--pay); text-decoration: underline; text-underline-offset: 3px; font: inherit; font-weight: 700; font-size: .97rem; padding: 8px 4px; cursor: pointer; }
    .qrwrap { display: flex; flex-direction: column; align-items: center; padding: 4px 16px 18px; }
    .qrwrap .qr { background: #fff; border-radius: 14px; padding: 8px; line-height: 0; border: 1px solid var(--line); }
    .qrwrap .qr svg { width: min(224px, 64vw); height: auto; }
    .qrwrap .hint { text-align: center; margin: 10px 0 0; }

    /* Indicações: trilha até o presente */
    .refcard { background: var(--sheet); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px 16px; }
    .ref-head { margin: 0; font-size: 1.2rem; font-weight: 700; line-height: 1.3; }
    .ref-sub { margin: 4px 0 0; color: var(--muted); }
    .track { display: flex; align-items: center; margin: 18px 2px 6px; }
    .stop {
      flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
      border: 2px solid var(--line); background: var(--sheet); color: var(--pay-ink); font-weight: 700; font-size: .9rem;
    }
    .stop.on { background: var(--pay); border-color: var(--pay); }
    .stop.gift { width: 46px; height: 46px; border-style: dashed; color: var(--muted); }
    .stop.gift svg { width: 24px; height: 24px; }
    .stop.gift.on { border-style: solid; background: #FFB020; border-color: #FFB020; color: #3B2600; box-shadow: 0 0 0 5px rgba(255,176,32,.22); }
    .rail { flex: 1 1 auto; height: 4px; min-width: 8px; background: var(--line); }
    .rail.on { background: var(--pay); }
    .track-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; flex: 1; margin-right: 10px; }
    .track-bar i { display: block; height: 100%; background: var(--pay); border-radius: 99px; }
    .track-legend { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); }
    .ref-chip { display: block; margin-top: 14px; padding: 10px 12px; border-radius: 12px; border-left: 4px solid var(--pay); background: var(--well); font-size: .97rem; }
    .ref-chip strong { color: var(--pay); }
    .coupon {
      margin-top: 16px; padding: 14px; border: 2px dashed var(--pay); border-radius: 14px; background: var(--pay-soft);
      display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center;
    }
    .coupon b { font-size: 1.35rem; color: var(--pay); white-space: nowrap; }
    .coupon span { font-size: .97rem; }
    .ref-how { margin-top: 12px; border: 0; }
    .ref-how > summary { min-height: 44px; padding: 8px 0; color: var(--muted); font-size: .97rem; }
    .ref-how ol { margin: 0; padding-left: 1.3em; color: var(--muted); }
    .ref-how li { margin-bottom: 4px; }

    /* Ajuda com a tela (foto do erro) */
    .photo-box { position: relative; display: flex; flex-direction: column; gap: 8px; }
    .photo-box select, .photo-box input[type=file], .photo-box textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; border-radius: 10px; }
    .photo-label { margin: 4px 0 0; font-size: 0.82rem; font-weight: 600; }
    .photo-desc { resize: vertical; min-height: 64px; }
    .photo-prev { display: block; max-width: 100%; max-height: 240px; border-radius: 12px; }
    .photo-out { display: flex; flex-direction: column; gap: 8px; }
    .photo-out p { margin: 0; }
    .photo-title { font-weight: 700; }
    .photo-steps { margin: 0; padding-left: 20px; }
    .photo-steps li { margin: 4px 0; }
    .photo-acoes { display: flex; gap: 8px; }
    .photo-acoes .btn { flex: 1; }
    .photo-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    @media (max-width: 380px) { .photo-acoes { flex-direction: column; } .photo-acoes .btn { flex: none; } }

    /* Ajuda e "ver mais" */
    details { border-top: 1px solid var(--line); }
    details:first-child { border-top: 0; }
    summary { list-style: none; cursor: pointer; padding: 15px 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 56px; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ""; width: 9px; height: 9px; border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: rotate(45deg); transition: transform .2s; flex: 0 0 auto; margin-right: 4px; }
    details[open] > summary::after { transform: rotate(-135deg); }
    details .body { padding: 0 14px 16px; color: var(--muted); white-space: pre-line; max-width: 52ch; }
    details.more { border: 0; margin-top: 8px; }
    details.more > summary { min-height: 44px; padding: 8px 4px; color: var(--muted); font-size: .97rem; }
    details.more > .group { margin-top: 4px; }

    /* Barra fixa de suporte e aviso de cópia */
    .dock {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: var(--sheet); border-top: 1px solid var(--line);
    }
    .dock .btn { margin: 0 auto; max-width: 488px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); opacity: 0;
      background: var(--ink); color: var(--sheet); padding: 11px 18px; border-radius: 999px; font-weight: 700;
      pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; white-space: nowrap;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    .updated { text-align: center; color: var(--muted); font-size: .88rem; padding: 26px 0 8px; }
    .center { text-align: center; padding: 22px 8px 30px; }
    .center h2 { margin: 0 0 8px; font-size: 1.35rem; }
    .center p { margin: 0 auto; color: var(--muted); max-width: 34ch; }
    .pin-input {
      font-family: var(--mono); font-size: 2rem; text-align: center; letter-spacing: .45em; width: 8.5em;
      padding: 10px 0 10px .45em; border-radius: 14px; border: 2px solid var(--line); background: var(--sheet); color: var(--ink); margin: 16px 0 4px;
    }
    .sk { height: 64px; border-radius: 16px; background: var(--well); margin-top: 12px; }

    @media (max-width: 360px) {
      .seg-row svg { width: 40px; height: 70px; }
      .digits { min-height: 70px; }
      .key { font-size: .8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="brand" id="brand">Portal do Assinante</p>
      <h1 id="greeting">Carregando…</h1>
    </header>

    <section class="box" id="box" data-state="blocked" aria-live="polite">
      <div class="box-status"><span class="standby" aria-hidden="true"></span><span id="boxStatus">Conectando…</span></div>
      <div class="digits" id="digits"></div>
      <p class="box-caption" id="boxCaption"></p>
      <div class="box-foot" id="boxFoot" hidden></div>
    </section>
    <a class="paynow" id="paynow" href="#renovar" hidden></a>

    <main id="sheet">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    </main>
    <div class="updated" id="updated"></div>
  </div>

  <div class="dock" id="dock" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./portal-config.js"></script>
  <script>
/* QRCode for JavaScript - Copyright (c) 2009 Kazuhiko Arase - MIT License (http://www.opensource.org/licenses/mit-license.php). "QR Code" is a registered trademark of DENSO WAVE INCORPORATED. */
window.PortalQR=(function(){var M={},C={};function req(n){n=n.replace(/^\.\/(?:\.\.\/vendor\/QRCode\/)?/,'').replace(/\.js$/,'');if(C[n])return C[n].exports;var m={exports:{}};C[n]=m;M[n](m,m.exports,req);return m.exports;}
M["QR8bitByte"]=function(module,exports,require){
var QRMode = require('./QRMode');

function QR8bitByte(data) {
	this.mode = QRMode.MODE_8BIT_BYTE;
	this.data = data;
}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};

module.exports = QR8bitByte;

};
M["QRBitBuffer"]=function(module,exports,require){
function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};
M["QRErrorCorrectLevel"]=function(module,exports,require){
module.exports = {
	L : 1,
	M : 0,
	Q : 3,
	H : 2
};


};
M["QRMaskPattern"]=function(module,exports,require){
module.exports = {
	PATTERN000 : 0,
	PATTERN001 : 1,
	PATTERN010 : 2,
	PATTERN011 : 3,
	PATTERN100 : 4,
	PATTERN101 : 5,
	PATTERN110 : 6,
	PATTERN111 : 7
};

};
M["QRMath"]=function(module,exports,require){
var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};
	
for (var i = 0; i < 8; i++) {
	QRMath.EXP_TABLE[i] = 1 << i;
}
for (var i = 8; i < 256; i++) {
	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];
}
for (var i = 0; i < 255; i++) {
	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

module.exports = QRMath;

};
M["QRMode"]=function(module,exports,require){
module.exports = {
    MODE_NUMBER :       1 << 0,
    MODE_ALPHA_NUM :    1 << 1,
    MODE_8BIT_BYTE :    1 << 2,
    MODE_KANJI :        1 << 3
};

};
M["QRPolynomial"]=function(module,exports,require){
var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {

    // Reduz a foto no próprio aparelho (lado máximo 800 px, JPEG): leve e legível para a análise
    function compressPhoto(file) {
      return new Promise(function (resolve, reject) {
        var src = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          var k = Math.min(1, 800 / Math.max(w, h));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(src);
          var data = c.toDataURL('image/jpeg', 0.7);
          if (data.length > 380000) data = c.toDataURL('image/jpeg', 0.5);
          resolve(data);
        };
        img.onerror = function () { URL.revokeObjectURL(src); reject(new Error('foto')); };
        img.src = src;
      });

      function mostrar(b) {

        out.innerHTML = '';

          out.appendChild(el('p', { text: photo ? 'Não deu para entender bem o problema. Tire outra foto, de perto e com boa luz, ou conte com mais detalhes o que está acontecendo.' : 'Não deu para entender bem o problema. Conte com mais detalhes o que está acontecendo ou tire uma foto da tela.' }));

          out.appendChild(el('button', { type: 'button', class: 'btn', text: '✅ Resolveu', onclick: function () {

        var timedOut = false;
        var timer = setTimeout(function () { timedOut = true; if (ctl) ctl.abort(); }, 60000);
        fetch(PP.api + '/?t=' + encodeURIComponent(PP.id) + '&acao=foto', {
          method: 'POST', cache: 'no-store', referrerPolicy: 'no-referrer', headers: headers,
          body: JSON.stringify({ imagem: photo || undefined, aparelho: dev.value, descricao: desc.value.trim() }), signal: ctl ? ctl.signal : undefined
        })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); })
          .then(function (res) {
            clearTimeout(timer);
            if (res.body && res.body.ok) return mostrar(res.body);
            var b = res.body || {};
            mostrarErro(b.error || '', res.status, b.detalhe);
          })
          .catch(function () {
            clearTimeout(timer); out.innerHTML = '';
            mostrarErro(timedOut ? 'tempo' : 'rede', 0, '');
          })
          .then(function () { go.textContent = 'Pedir ajuda'; atualizarBotao(); });
      });

      s.appendChild(el('div', { class: 'photo-box' }, [
        el('p', { class: 'photo-label', text: '1. Tire uma foto da tela (opcional se você escrever o problema)' }),
        el('div', { class: 'photo-acoes' }, [bCam, bGal]), camera, gallery, prev,
        el('p', { class: 'photo-label', text: '2. Qual é o aparelho?' }), dev,
        el('p', { class: 'photo-label', text: '3. O que está acontecendo? (opcional se tiver foto)' }), desc,
        go, note, out
      ]));
      return s;
    }

    function askPin(id, wrong) {
      setBox('blocked', 'Portal protegido', '----', '', 'Digite os 4 últimos números do seu telefone cadastrado.');
      $('greeting').textContent = 'Confirme seu acesso';
      hidePage();
      sheet.innerHTML = '';
      var input = el('input', { class: 'pin-input', type: 'tel', inputmode: 'numeric', maxlength: '4', autocomplete: 'off', placeholder: '0000', 'aria-label': 'Últimos 4 números do telefone' });
      var go = el('button', { class: 'btn', type: 'button', text: 'Entrar' });
      var msg = el('p', { text: wrong ? 'Os números não conferem. Tente de novo.' : 'É só para proteger seus dados se o link for encaminhado.' });
      go.onclick = function () { var v = (input.value || '').replace(/\D/g, ''); if (v.length === 4) { try { sessionStorage.setItem('pp_' + id, v); } catch (e) {} load(); } else { msg.textContent = 'Digite os 4 números.'; } };
      input.onkeydown = function (e) { if (e.key === 'Enter') go.onclick(); };
      sheet.appendChild(el('div', { class: 'center' }, [msg, input, el('div', { style: 'max-width:280px; margin:0 auto;' }, [go])]));
      setTimeout(function () { input.focus(); }, 50);
    }

    function load() {
      var id = new URLSearchParams(location.search).get('id') || '';
      var api = String(window.PORTAL_API_URL || '').trim().replace(/\/+$/, '');
      if (api && !/^https?:\/\//i.test(api)) api = 'https://' + api;
      if (!id) return showState('Link incompleto', 'Use o link completo que você recebeu do suporte.');
      if (!api) return showState('Portal em configuração', 'Este portal ainda não está pronto. Fale com o suporte.');
      var pin = ''; try { pin = sessionStorage.getItem('pp_' + id) || ''; } catch (e) {}
      var headers = pin ? { 'X-Portal-Pin': pin } : {};
      PP.id = id; PP.pin = pin; PP.api = api;
      var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
      fetch(api + '/?t=' + encodeURIComponent(id) + (new URLSearchParams(location.search).get('a') === '1' ? '&a=1' : ''), { cache: 'no-store', referrerPolicy: 'no-referrer', headers: headers, signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; }); })
        .then(function (res) {
          clearTimeout(timer);
          if (res.body && res.body.ok) return render(res.body);
          var err = res.body && res.body.error;
          if (err === 'pin_required') return askPin(id, false);
          if (err === 'pin_wrong') { try { sessionStorage.removeItem('pp_' + id); } catch (e) {} return askPin(id, true); }
          if (err === 'too_many') return showState('Muitas tentativas', 'Por segurança, o acesso ficou travado por até 30 minutos. Tente de novo depois ou fale com o suporte.');
          if (err === 'pin_unavailable') return showState('Acesso protegido', 'Fale com o suporte para liberar o seu acesso.');
          if (err === 'disabled') return showState('Acesso desativado', 'O seu acesso ao portal foi desativado. Fale com o suporte.');
          if (res.status === 404) return showState('Link inválido ou vencido', 'Peça um novo link ao suporte.');
          showState('Não foi possível carregar', 'Tente de novo em alguns instantes.', true);
        })
        .catch(function () {
          clearTimeout(timer);
          showState('Sem conexão', 'A internet está lenta ou caiu. Toque abaixo para tentar de novo.', true);
        });
    }
    load();
  })();
  </script>
